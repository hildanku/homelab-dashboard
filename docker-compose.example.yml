services:
  backend:
    image: ghcr.io/hildanku/homelab-dashboard-backend:latest
    container_name: homelab-dashboard-backend
    restart: unless-stopped
    ports:
      - "5551:5551"
    volumes:
      - ./config.json:/app/config.json:ro

  frontend:
    image: ghcr.io/hildanku/homelab-dashboard-frontend:latest
    container_name: homelab-dashboard-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
