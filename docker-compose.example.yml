services:
  backend:
    image: ghcr.io/hildanku/homelab-dashboard-backend:latest
    container_name: homelab-dashboard-backend
    restart: unless-stopped
    ports:
      - "5551:5551"
    volumes:
      - ./config.json:/app/config.json:ro
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:?set ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_TTL: ${SESSION_TTL:-12h}
      BCRYPT_COST: ${BCRYPT_COST:-10}

  frontend:
    image: ghcr.io/hildanku/homelab-dashboard-frontend:latest
    container_name: homelab-dashboard-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
